name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: petplay-linux-x64
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: petplay-windows-x64
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: petplay-linux-arm64-experimental
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Build Unity origin package
        run: deno run -A --no-config utils/build-unity-origin-package.ts
      # Chunk indexes for delta updates (classes/updateChunks.ts), then SHA256SUMS over everything.
      - name: Index and hash release files
        run: >-
          deno run -A --no-config utils/release-assets.ts dist
          petplay petplay.exe petplay-aarch64 PetPlay-VRCOrigin.unitypackage
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/petplay
            dist/petplay.exe
            dist/petplay-aarch64
            dist/PetPlay-VRCOrigin.unitypackage
            dist/petplay.chunks.json
            dist/petplay.exe.chunks.json
            dist/petplay-aarch64.chunks.json
            dist/SHA256SUMS
            resources/licenses/raylib.txt
            resources/licenses/scap.txt
